<html lang="en-US" style="width: unset; max-width: unset">
	<head>
		<meta name="color-scheme" content="dark" />
		<title>Better Lyrics Custom Lyrics Editor</title>
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://api.fontshare.com/v2/css?f[]=satoshi@1&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../src/options/options.css" />
		<link rel="stylesheet" href="../src/options/clyrics/editor.css" />
		<link rel="stylesheet" href="../src/options/clyrics/clyrics.css" />
	</head>
	<body>
		<!-- TOPBAR -->
		<div id="topbar" class="topbar">			
			<div class="top-left">
				<svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 512 512">
					<path fill="#f20c32" d="M512 256a256 256 0 1 1-512 0 256 256 0 0 1 512 0M216.9 101.5a159.7 159.7 0 0 0-113.7 200.1 159 159 0 0 0 137.2 113.2 155 155 0 0 0 124.2-42.1 153 153 0 0 0 49.9-132.9c-6-57-36-99-87-126.4a159 159 0 0 0-110.6-12M111.5 258c.2-54.7 23.5-97.7 70.4-126a144.1 144.1 0 0 1 207.4 67.5c36 83.6-15.1 181.2-104.5 198.3-54.3 10.3-100.2-6-137.7-46.4a139.5 139.5 0 0 1-35.6-93.4m164.3-52.2h28.6c7.9 0 12-4 12-12v-16.5c-.1-7.7-4.2-11.6-11.9-11.6H268c-9 0-12.3 3.3-12.3 12.4v87.5l-.2 5.4c-2.6-1-4.5-2-6.5-2.7a38.3 38.3 0 0 0-39 7.1 38.1 38.1 0 0 0-13.8 38 40 40 0 0 0 79.5-7.5c.2-18.9 0-37.7 0-57z"/>
					<path fill="#fff" d="M216.9 101.5a159.7 159.7 0 0 0-113.7 200.1 159 159 0 0 0 137.2 113.2 155 155 0 0 0 124.2-42.1 153 153 0 0 0 49.9-132.9c-6-57-36-99-87-126.4a159 159 0 0 0-110.6-12M111.5 258c.2-54.7 23.5-97.7 70.4-126a144.1 144.1 0 0 1 207.4 67.5c36 83.6-15.1 181.2-104.5 198.3-54.3 10.3-100.2-6-137.7-46.4a139.5 139.5 0 0 1-35.6-93.4m164.3-52.2h28.6c7.9 0 12-4 12-12v-16.5c-.1-7.7-4.2-11.6-11.9-11.6H268c-9 0-12.3 3.3-12.3 12.4v87.5l-.2 5.4c-2.6-1-4.5-2-6.5-2.7a38.3 38.3 0 0 0-39 7.1 38.1 38.1 0 0 0-13.8 38 40 40 0 0 0 79.5-7.5c.2-18.9 0-37.7 0-57z"/>
				</svg>
				
				<button id="actions-expand-btn" class="icon-btn tab-btns active-btn" style="padding: .625rem;">
					<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
						<path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 17h18M3 12h18M3 7h18"/>
					</svg>
				</button>
				<div class="action-buttons">
					<button id="action-file-btn" class="tab-first-btn action-btn tab-btns active-btn">
						<span class="label">File</span>
					</button>
					<button id="action-edit-btn" class="tab-secondary-btn action-btn tab-btns active-btn">
						<span class="label">Edit</span>
					</button>
					<button id="action-tools-btn" class="tab-last-btn action-btn tab-btns active-btn">
						<span class="label">Tools</span>
					</button>
				</div>
			</div>

			<div class="tab-buttons">
				<button id="tab-editor-btn" class="tab-first-btn tab-btn tab-btns active-btn">
					<span class="label">Editor</span>
				</button>
				<button id="tab-timing-btn" class="tab-secondary-btn tab-btn tab-btns">
					<span class="label">Timing</span>
				</button>
				<button id="tab-preview-btn" class="tab-secondary-btn tab-btn tab-btns">
					<span class="label">Preview</span>
				</button>
				<button id="tab-export-btn" class="tab-last-btn tab-btn tab-btns">
					<span class="label">Export</span>
				</button>
			</div>

			<div class="metadata">
				<span class="span-wseparator">
					<!-- <strong id="metadata-name">Snowman</strong>
					<div class="span-separator"></div>
					<strong id="metadata-duration">04:30</strong> -->
				</span>
				<span class="span-wseparator">
					<!-- <span id="metadata-artist">Sia</span>
					<div class="span-separator"></div>
					<span id="metadata-album">Everyday is Christmas (Deluxe Edition)</span> -->
				</span>
			</div>
		</div>
		
		<!-- EDITOR -->
		<div id="tab-editor" class="clyrics-container">
			<div class="small-topbar">
				<div id="agents-presets" class="rows">
					<button id="add-agent" class="small-btn">Add</button>
					<div id="added-agents" class="rows">
						<button class="small-btn">
							<div class="span-separator agent-col" style="background-color: #ff595e;"></div>
							Lead
						</button>
						<button class="small-btn">
							<div class="span-separator agent-col" style="background-color: #ff55ff;"></div>
							Duet
						</button>
					</div>
				</div>
				<div id="editor-layout" class="rows">
					<span id="current-editor-layout">Powerhouse</span>
					<button id="switch-layout" class="icon-btn left-tooltip-icon-btn" data-tooltip="Switch Layout">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 12a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2zm10-4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zm0-8a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
					</button>
				</div>
			</div>
			<!-- TOOLS -->
			<div class="tools">
				<div id="new-lyric-line" class="tool">
					<div class="actions">
						<button id="add-line" class="add-line active-btn">
							<svg class="plus-middle" width="16" height="16" viewBox="0 0 16 16">
								<path d="M7.99992 3.33331V12.6666M3.33325 7.99998H12.6666" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
							</svg>
							<span class="add-line-label-bottom">Line</span>
						</button>
						<div class="add-line-types">
							<button id="add-line-instrumental" class="add-line-type-btn active-btn">
								<svg class="plus-side" width="16" height="16" viewBox="0 0 16 16">
									<path d="M7.99992 3.33331V12.6666M3.33325 7.99998H12.6666" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
								<span class="add-line-label-side">Instrumental</span>
							</button>
	
							<button id="add-line-together" class="add-line-type-btn active-btn">
								<svg class="plus-side" width="16" height="16" viewBox="0 0 16 16">
									<path d="M7.99992 3.33331V12.6666M3.33325 7.99998H12.6666" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
								<span class="add-line-label-side">Together</span>
							</button>
						</div>
					</div>
					<span class="tool-section-span">New Lyric Line</span>
				</div>
	
				<div class="separator-row"></div>
	
				<div id="line-timing" class="tool">
					<div class="actions2 tools-items">
						<div id="start-time" class="tool-input">
							<span class="tool-property">Start Time</span>
							<div id="start-time-input" class="tool-input-multiple">
								<input id="start-time-input-minutes" type="number" class="input" placeholder="min" disabled/>
								<input id="start-time-input-seconds" type="number" class="input" placeholder="sec" min="-59" max="59" disabled/>
								<input id="start-time-input-ms" type="number" class="input" placeholder="ms" min="-999" max="999" disabled/>
							</div>
						</div>
						<div id="end-time" class="tool-input">
							<span class="tool-property">End Time</span>
							<div id="end-time-input" class="tool-input-multiple">
								<input id="end-time-input-minutes" type="number" class="input" placeholder="min" disabled/>
								<input id="end-time-input-seconds" type="number" class="input" placeholder="sec" min="-59" max="59" disabled/>
								<input id="end-time-input-ms" type="number" class="input" placeholder="ms" min="-999" max="999" disabled/>
							</div>
						</div>
					</div>
					<span class="tool-section-span">Line Timing</span>
				</div>
	
				<div class="separator-row"></div>
	
				<div id="line-properties" class="tool" style="width: 150px">
					<div class="tools-items">
						<div id="instrumental-line" class="tool-input">
							<span class="tool-property">Instrumental</span>
							<button id="instrumental-btn" class="checkbox" disabled>
								<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
									<path fill="black" d="m9.55 18l-5.7-5.7l1.425-1.425L9.55 15.15l9.175-9.175L20.15 7.4z"/>
								</svg>
							</button>
						</div>
						<div id="background-line" class="tool-input">
							<span class="tool-property">Background</span>
							<button id="background-btn" class="checkbox" disabled>
								<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
									<path fill="black" d="m9.55 18l-5.7-5.7l1.425-1.425L9.55 15.15l9.175-9.175L20.15 7.4z"/>
								</svg>
							</button>
						</div>
					</div>
					<span class="tool-section-span">Line Properties</span>
				</div>
				
				<div class="separator-row"></div>
	
				<div id="line-display" class="tool" style="width: 150px;">
					<div class="tools-items">
						<div id="show-timeline" class="tool-input">
							<span class="tool-property">Timeline</span>
							<button id="show-timeline-btn" class="checkbox">
								<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
									<path fill="black" d="m9.55 18l-5.7-5.7l1.425-1.425L9.55 15.15l9.175-9.175L20.15 7.4z"/>
								</svg>
							</button>
						</div>
						<div id="show-roman" class="tool-input">
							<span class="tool-property">Romanization</span>
							<button id="show-roman-btn" class="checkbox">
								<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
									<path fill="black" d="m9.55 18l-5.7-5.7l1.425-1.425L9.55 15.15l9.175-9.175L20.15 7.4z"/>
								</svg>
							</button>
						</div>
						<div id="show-translate" class="tool-input">
							<span class="tool-property">Translation</span>
							<button id="show-translate-btn" class="checkbox">
								<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
									<path fill="black" d="m9.55 18l-5.7-5.7l1.425-1.425L9.55 15.15l9.175-9.175L20.15 7.4z"/>
								</svg>
							</button>
						</div>
					</div>
					<span class="tool-section-span">Line Display</span>
				</div>
			</div>
	
			<!-- LYRIC LINES -->
			<div id="lyric-lines" class="lyric-lines">
				<div id="no-lyrics" class="no-lyrics">
					<h1><strong>No Lyrics</strong></h1>
					<h3>Add a new lyric line from the top left or import the lyrics from a file or provider!</h3>
				</div>
			</div>
	
		</div>
		
		<!-- PLAYBAR -->
		<div class="playbar">
			<label class="drag-audio" for="audio-file-playbar">
				<input id="audio-file-playbar" accept="audio/*" type="file"/>
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M6 22q-.82 0-1.41-.59T4 20V4q0-.82.59-1.41T6 2h7.17q.4 0 .77.15t.64.42l4.85 4.85q.27.28.42.64t.15.76V20q0 .82-.59 1.41T18 22zm7-14q0 .42.29.71T14 9h4l-5-5zm-2.25 11q.95 0 1.6-.65t.65-1.6V13h2q.42 0 .71-.29T16 12t-.29-.71T15 11h-2q-.42 0-.71.29T12 12v2.88q-.28-.2-.59-.3t-.66-.08q-.95 0-1.6.65t-.65 1.6.65 1.6 1.6.65"/></svg>
				<h3>Drag or select an audio file here</h3>
			</label>
			<!-- <div class="audio-controls">
				<button id="play-pause-btn" class="icon-btn play-pause-btn" disabled>
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
						<path fill="currentColor" d="M8 19h2V5H8v14m6-14v14h2V5h-2z"/>
					</svg>
				</button>
				<span id="current-time" class="time-display">00:00.000</span>
				<input id="seek-bar" type="range" class="seek-bar" min="0" max="100" value="0" step="0.01" disabled/>
				<span id="total-duration" class="time-display">00:00.000</span>
			</div> -->
		</div>

		<!-- FREEFORM ELEMENTS (CONTEXT MENU, MODAL) -->
		<!-- Basic Modal -->
		<div id="modal-overlay" class="modal-overlay">
			<div class="modal">
				<div class="modal-header">
					<h3 id="modal-title" class="modal-title"></h3>
					<button id="modal-close" class="modal-close-btn" aria-label="Close">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
							<path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
						</svg>
					</button>
				</div>
				<div class="modal-body">
					<!-- <span id="modal-message" class="modal-message">By confirming, you acknowledge that the following lyrics you're about to publish abides the rules for the following provider and are not against their terms.</span> -->
					<!-- <input type="text" id="modal-input" class="modal-input" placeholder=""> -->
				</div>
				<div class="modal-footer">
					<!-- <button id="modal-cancel" class="modal-btn modal-btn-secondary">Cancel</button>
					<button id="modal-confirm" class="modal-btn modal-btn-primary">Confirm</button> -->
				</div>
			</div>
		</div>

		<!-- Long Modal -->
		<div id="long-modal-overlay" class="modal-overlay">
			<div class="long-modal modal">
				<div class="modal-header">
					<h3 id="modal-title" class="modal-title"></h3>
					<button id="modal-close" class="modal-close-btn" aria-label="Close">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
							<path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
						</svg>
					</button>
				</div>
				<div class="modal-body">

				</div>
				<div class="modal-footer">
					
				</div>
			</div>
		</div>

		<div id="clyrics-modal-overlay" class="modal-overlay">
			<div class="medium-modal modal clyrics-modal">
				<div class="modal-header">
					<h3 class="modal-title">Custom Lyrics</h3>
					<button id="clyrics-modal-close" class="modal-close-btn" aria-label="Close">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
							<path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
						</svg>
					</button>
				</div>

				<div class="modal-body-wrapped modal-body">
					<div id="clyrics-modal-list"></div>
					<div id="clyrics-new-lyrics" style="display: none;"></div>
				</div>
			</div>
		</div>

		<div id="action-file-menu" class="list-buttons hidden" style="opacity: 0;"></div>

		<div id="context-menu" class="list-buttons hidden" style="opacity: 0;"></div>
	</body>
	<script type="module" defer src="../src/options/clyrics/editor.ts"></script>
	<script type="module" defer src="../src/options/clyrics.ts"></script>
</html>
